<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OBS Overlay Settings</title>
  <style>
    :root {
      --accent: #ff0055;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #11131c;
      color: #f3f4f6;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    h3 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: rgba(255, 0, 85, 0.2);
      color: #ff0055;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      display: block;
      margin-bottom: 4px;
    }
    select, input[type="text"] {
      width: 100%;
      background: #1a1e2e;
      border: 1px solid #282f46;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus {
      border-color: #ff0055;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: none;
      cursor: pointer;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      color: #d1d5db;
    }
    .checkbox-row input {
      accent-color: #ff0055;
      cursor: pointer;
    }
    .now-playing-card {
      margin: 12px 0;
      padding: 10px;
      background: #161926;
      border: 1px solid #262b3d;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .now-playing-thumb {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      background: #23283c;
      flex-shrink: 0;
    }
    .now-playing-info {
      flex: 1;
      min-width: 0;
    }
    .now-playing-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-playing-artist {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      width: 100%;
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #ff2b73;
    }
    .btn-secondary {
      background: #23283c;
    }
    .btn-secondary:hover {
      background: #2f3650;
    }
    .status {
      font-size: 11px;
      color: #10b981;
      text-align: center;
      margin-top: 6px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3><span>🎵</span> OBS Overlay</h3>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span class="badge" id="platform-badge" style="display: none; background: rgba(255,255,255,0.1); color: #d1d5db;">YouTube</span>
      <span class="badge" id="conn-badge">Checking...</span>
    </div>
  </div>

  <div id="now-playing-box" class="now-playing-card" style="display: none;">
    <img id="now-playing-art" class="now-playing-thumb" src="" alt="">
    <div class="now-playing-info">
      <div id="now-playing-title" class="now-playing-title"></div>
      <div id="now-playing-artist" class="now-playing-artist"></div>
    </div>
  </div>

  <div class="form-group">
    <label>Theme Style (Updates Live!)</label>
    <select id="theme">
      <option value="default">✨ Modern Glass Card</option>
      <option value="compact">💊 Compact Floating Pill</option>
      <option value="vinyl">💿 Retro Spinning Vinyl</option>
      <option value="cyberpunk">🤖 Cyberpunk Neon HUD</option>
      <option value="spotify">🟢 Spotify Clean Bar</option>
      <option value="lofi">🌸 Lo-Fi Pastel Anime</option>
      <option value="pixel">👾 Retro 8-Bit Pixel Arcade</option>
      <option value="minimal">🪶 Ultra Minimal (Text Only)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Up Next Playlist / Mix Queue</label>
    <select id="upcoming-count">
      <option value="0">Off (Don't show Up Next)</option>
      <option value="1">1 Next Track</option>
      <option value="2">2 Next Tracks</option>
      <option value="3" selected>3 Next Tracks (Default)</option>
      <option value="4">4 Next Tracks</option>
      <option value="5">5 Next Tracks</option>
    </select>
  </div>

  <div class="form-group">
    <label>Accent Glow Color</label>
    <div class="color-row">
      <input type="color" id="accent" value="#ff0055" />
      <span id="accent-hex" style="font-family: monospace; font-size: 11px; color: #9ca3af;">#ff0055</span>
    </div>
  </div>

  <div class="form-group">
    <label class="checkbox-row">
      <input type="checkbox" id="autohide" checked />
      <span>Auto-hide overlay when paused</span>
    </label>
  </div>

  <div class="actions">
    <button id="copy-btn" class="btn-secondary">📋 Copy Local OBS File Link</button>
  </div>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
